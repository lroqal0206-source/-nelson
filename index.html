<style>
/* ===== ЦВЕТА И ШРИФТЫ: меняются здесь ===== */
:root {
  --bg: #000000;
  --bg2: #0A0A0A;
  --text: #FFFFFF;
  --muted: #A1A1A1;
  --line: #1F1F1F;
  --line2: #2A2A2A;
  --glass: rgba(255,255,255,0.03);
  --glass-border: rgba(255,255,255,0.08);
  --radius: 14px;
  --max: 480px;
  --font-head: 'Unbounded', 'Space Grotesk', Arial, sans-serif;
  --font-text: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  min-height: 100vh; min-height: 100dvh;
  font-family: var(--font-text); color: var(--text); line-height: 1.5;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%) fixed;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 1px solid #fff; outline-offset: 3px; }
::selection { background: #fff; color: #000; }

/* ===== ФОНОВЫЕ ЭФФЕКТЫ ===== */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
}
.bg-glow {
  position: absolute; top: 50%; left: 50%;
  width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax;
  background:
    radial-gradient(circle at 38% 42%, #fff 0, transparent 22%),
    radial-gradient(circle at 64% 60%, #fff 0, transparent 18%);
  opacity: 0.05;
  animation: rotate 30s linear infinite;
}
@keyframes rotate { to { transform: rotate(360deg); } }

.particles { position: absolute; inset: 0; }
.particles .p {
  position: absolute; color: #fff; opacity: 0.05; line-height: 1; user-select: none;
  animation: drift var(--d, 30s) ease-in-out var(--dl, 0s) infinite alternate;
}
@keyframes drift {
  from { transform: translate(0, 0); opacity: 0.05; }
  to   { transform: translate(var(--dx, 40px), var(--dy, -60px)); opacity: 0.15; }
}

.noise {
  position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0.07;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.cursor-glow {
  position: fixed; top: 0; left: 0; width: 500px; height: 500px; z-index: 1; pointer-events: none;
  border-radius: 50%; opacity: 0; transition: opacity 0.6s;
  background: radial-gradient(circle, rgba(255,255,255,0.09), transparent 62%);
  will-change: transform;
}

/* ===== КОНТЕНТ ===== */
.wrap { position: relative; z-index: 2; width: 100%; max-width: var(--max); margin: 0 auto; padding: 64px 20px 40px; }

.rise { animation: rise 0.85s cubic-bezier(0.2, 0.7, 0.2, 1) calc(var(--i, 0) * 90ms) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } }

/* Аватар */
.avatar { position: relative; width: 112px; height: 112px; margin: 0 auto 24px; border-radius: 50%; }
.avatar img {
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  filter: grayscale(1) contrast(1.05);
  border: 1.5px solid rgba(255,255,255,0.85);
  transition: box-shadow 0.4s, transform 0.4s;
}
.avatar:hover img { box-shadow: 0 0 44px rgba(255,255,255,0.35); transform: scale(1.03); }
.avatar::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  animation: pulse 2.8s ease-out infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
  100% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
}

/* Ник */
.nick {
  font-family: var(--font-head); font-weight: 700; text-transform: uppercase; text-align: center;
  font-size: clamp(1.7rem, 8vw, 2.4rem); letter-spacing: 0.08em; line-height: 1.15;
  overflow-wrap: anywhere; min-height: 1.2em;
}
.caret { display: inline-block; width: 2px; height: 0.9em; margin-left: 4px; background: #fff; vertical-align: -0.08em; animation: blink 1s steps(1) infinite; }
.caret.off { display: none; }
@keyframes blink { 50% { opacity: 0; } }

/* Бейджи */
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
.badge {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.badge svg { width: 12px; height: 12px; color: #fff; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.8); animation: dotpulse 2s ease-in-out infinite; }
@keyframes dotpulse { 50% { opacity: 0.35; } }

.bio { margin-top: 18px; text-align: center; color: var(--muted); font-size: 14.5px; font-weight: 300; letter-spacing: 0.02em; }
.views { display: flex; justify-content: center; align-items: center; gap: 7px; margin-top: 14px; font-size: 12px; color: #6b6b6b; letter-spacing: 0.08em; }
.views svg { width: 14px; height: 14px; }

/* Кнопки соцсетей */
.links { display: grid; gap: 12px; margin-top: 36px; }
.link {
  position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 17px 18px; border-radius: var(--radius); text-align: left;
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  transition: background-color 0.3s, color 0.3s, transform 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.link.primary { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.22); }
.link .ico { width: 22px; height: 22px; flex: none; display: grid; place-items: center; }
.link .ico svg { width: 22px; height: 22px; }
.link .lbl { flex: 1; font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
.link .arr { width: 18px; height: 18px; flex: none; opacity: 0.45; transition: transform 0.3s, opacity 0.3s; }
.link .arr svg { width: 18px; height: 18px; }
.link:hover, .link:focus-visible {
  background-color: #fff; color: #000; transform: translateX(6px); border-color: #fff;
  box-shadow: 0 0 34px rgba(255,255,255,0.28), 0 10px 30px rgba(0,0,0,0.5);
}
.link:hover .arr, .link:focus-visible .arr { opacity: 1; transform: translateX(4px); }
.link:active { transform: translateX(6px) scale(0.985); }
.ripple {
  position: absolute; border-radius: 50%; background: #fff; mix-blend-mode: difference; opacity: 0.5;
  pointer-events: none; transform: scale(0); animation: rip 0.65s ease-out forwards;
}
@keyframes rip { to { transform: scale(1); opacity: 0; } }

.empty {
  padding: 22px; text-align: center; color: var(--muted); font-size: 14px;
  border: 1px dashed var(--line2); border-radius: var(--radius);
}

/* Заголовки секций */
.sec {
  display: flex; align-items: center; gap: 14px; margin: 48px 0 18px; color: var(--muted);
  font: 600 11px/1 var(--font-head); letter-spacing: 0.28em; text-transform: uppercase;
}
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line2); }

/* Discord-виджет */
.dc {
  padding: 16px; border-radius: var(--radius);
  background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}
.dc-top { display: flex; align-items: center; gap: 14px; }
.dc-av { position: relative; width: 48px; height: 48px; flex: none; }
.dc-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; filter: grayscale(1); border: 1px solid rgba(255,255,255,0.3); }
.dc-st { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #0A0A0A; background: #fff; box-sizing: content-box; width: 8px; height: 8px; }
.dc-st.idle { background: transparent; box-shadow: inset 0 0 0 1.5px #fff; }
.dc-st.dnd { background: #777; }
.dc-st.offline { background: #333; }
.dc-info { flex: 1; min-width: 0; }
.dc-name { font-weight: 600; font-size: 15px; letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-tag { font-size: 12.5px; color: var(--muted); }
.dc-copy {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 10px;
  border: 1px solid var(--glass-border); color: var(--muted); transition: 0.25s;
}
.dc-copy svg { width: 16px; height: 16px; }
.dc-copy:hover { background: #fff; color: #000; border-color: #fff; }
.dc-act {
  display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--line2); font-size: 12.5px; color: var(--muted);
}
.dc-act svg { width: 16px; height: 16px; color: #fff; flex: none; }
.dc-act b { color: #fff; font-weight: 500; }

/* Проекты */
.projects { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.proj {
  position: relative; display: block; overflow: hidden; aspect-ratio: 4 / 3; border-radius: var(--radius);
  border: 1px solid var(--glass-border); background: #0A0A0A;
  transition: border-color 0.4s, box-shadow 0.4s;
}
.proj img {
  width: 100%; height: 100%; object-fit: cover;
  filter: grayscale(1) contrast(1.05) brightness(0.8);
  transition: filter 0.6s, transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.proj:hover { border-color: rgba(255,255,255,0.4); box-shadow: 0 0 30px rgba(255,255,255,0.12); }
.proj:hover img { filter: grayscale(0) contrast(1) brightness(1); transform: scale(1.07); }
.proj-cap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 12px 11px;
  background: linear-gradient(transparent, rgba(0,0,0,0.9));
}
.proj-cap b { display: block; font: 600 11px/1.2 var(--font-head); letter-spacing: 0.08em; text-transform: uppercase; }
.proj-cap span { display: block; margin-top: 4px; font-size: 11.5px; color: var(--muted); }

/* Footer */
.foot { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line2); text-align: center; color: #6b6b6b; font-size: 12px; letter-spacing: 0.06em; }

/* Toast */
.toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 100; padding: 11px 18px; border-radius: 10px;
  background: #fff; color: #000; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
  box-shadow: 0 10px 40px rgba(255,255,255,0.15); border: 1px solid #000;
  opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity 0.3s, transform 0.3s;
}
.toast.show { opacity: 1; transform: none; }

noscript { position: relative; z-index: 2; display: block; padding: 40px 20px; text-align: center; color: var(--muted); }

@media (min-width: 520px) { .wrap { padding-top: 84px; } .avatar { width: 124px; height: 124px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
  html { scroll-behavior: auto; }
}
</style>
</head>

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  async function copyText(text) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; }
    catch (e) {
      try {
        const ta = el('textarea', { style: 'position:fixed;opacity:0;top:0;left:0' });
        ta.value = text; document.body.append(ta); ta.select();
        ok = document.execCommand('copy'); ta.remove();
      } catch (e2) { ok = false; }
    }
    toast(ok ? 'Copied' : 'Copy failed');
  }

  /* ----- Ripple ----- */
  function ripple(e) {
    const b = e.currentTarget, r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
    const s = el('span', { class: 'ripple' });
    s.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
    b.append(s);
    setTimeout(() => s.remove(), 700);
  }

  /* ----- Печатающийся ник ----- */
  function typeText(node, text) {
    const chars = Array.from(text);
    if (reduce) { node.textContent = text; return Promise.resolve(); }
    node.textContent = '';
    return new Promise((resolve) => {
      let i = 0;
      setTimeout(function tick() {
        node.textContent = chars.slice(0, ++i).join('');
        if (i < chars.length) setTimeout(tick, 95); else resolve();
      }, 650);
    });
  }

  /* ----- Счётчик просмотров ----- */
  function countUp(node, to) {
    const fmt = (n) => n.toLocaleString('en-US') + ' views';
    if (reduce) { node.textContent = fmt(to); return; }
    const t0 = performance.now(), dur = 1400;
    (function step(t) {
      const p = Math.min((t - t0) / dur, 1);
      node.textContent = fmt(Math.round((1 - Math.pow(1 - p, 3)) * to));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  /* ----- Рендер ----- */
  const app = document.getElementById('app');
  const name = CONFIG.displayName || CONFIG.username || 'Profile';
  const fallbackAvatar = 'https://placehold.co/300x300/0A0A0A/FFFFFF?text=' + encodeURIComponent((name[0] || '?').toUpperCase());

  document.title = name + ' — bio';
  setMeta('property', 'og:title', name + ' — bio');
  setMeta('property', 'og:description', CONFIG.bio || '');
  setMeta('property', 'og:image', CONFIG.avatar || '');
  setMeta('name', 'description', CONFIG.bio || '');

  // Аватар
  const avImg = el('img', { src: CONFIG.avatar || fallbackAvatar, alt: name, width: 124, height: 124 });
  avImg.addEventListener('error', () => { avImg.src = fallbackAvatar; }, { once: true });
  app.append(rise(el('div', { class: 'avatar' }, avImg)));

  // Ник
  const nickText = el('span', { class: 'nick-text' });
  const caret = el('span', { class: 'caret' });
  const h1 = el('h1', { class: 'nick', 'aria-label': name }, nickText, caret);
  app.append(rise(h1));
  typeText(nickText, name).then(() => setTimeout(() => caret.classList.add('off'), 1800));

  // Бейджи
  const BADGE = {
    online:   () => el('span', { class: 'dot' }),
    premium:  () => el('span', { html: ICONS.star }),
    verified: () => el('span', { html: ICONS.check })
  };
  if (Array.isArray(CONFIG.badges) && CONFIG.badges.length) {
    const box = el('div', { class: 'badges' });
    CONFIG.badges.forEach((b) => {
      const key = String(b).toLowerCase();
      const icon = BADGE[key] ? BADGE[key]() : el('span', { class: 'dot' });
      box.append(el('span', { class: 'badge' }, icon, String(b).toUpperCase()));
    });
    app.append(rise(box));
  }

  // Био
  if (CONFIG.bio) app.append(rise(el('p', { class: 'bio' }, CONFIG.bio)));

  // Просмотры
  if (CONFIG.showViews) {
    const vt = el('span', {});
    app.append(rise(el('div', { class: 'views' }, el('span', { html: ICONS.eye }), vt)));
    countUp(vt, Number(CONFIG.views) || 0);
  }

  // Соцсети
  const list = el('nav', { class: 'links', 'aria-label': 'Social links' });
  (CONFIG.socials || []).forEach((s) => {
    const icon = ICONS[s.type] || ICONS.website;
    const isCopy = !s.url && s.copy;
    const kids = [
      el('span', { class: 'ico', html: icon }),
      el('span', { class: 'lbl' }, s.label || s.type),
      el('span', { class: 'arr', html: isCopy ? ICONS.copy : ICONS.arrow })
    ];
    const cls = 'link' + (s.primary ? ' primary' : '');
    let node;
    if (s.url) {
      node = el('a', { class: cls, href: safeUrl(s.url), target: '_blank', rel: 'noopener' }, ...kids);
    } else if (s.copy) {
      node = el('button', { class: cls, type: 'button', 'aria-label': (s.label || s.type) + ': copy' }, ...kids);
      node.addEventListener('click', () => copyText(s.copy));
    } else return;
    node.addEventListener('pointerdown', ripple);
    list.append(rise(node));
  });
  if (!list.children.length) {
    list.append(rise(el('div', { class: 'empty' }, 'Добавь ссылки в CONFIG')));
  }
  app.append(list);

  // Discord-виджет
  const dc = CONFIG.discord;
  if (dc && dc.enabled && dc.tag) {
    const status = ['online', 'idle', 'dnd', 'offline'].includes(dc.status) ? dc.status : 'online';
    const dcImg = el('img', { src: CONFIG.avatar || fallbackAvatar, alt: '' });
    dcImg.addEventListener('error', () => { dcImg.src = fallbackAvatar; }, { once: true });
    const copyBtn = el('button', { class: 'dc-copy', type: 'button', 'aria-label': 'Copy Discord tag', html: ICONS.copy });
    copyBtn.addEventListener('click', () => copyText(dc.tag));
    const card = el('div', { class: 'dc' },
      el('div', { class: 'dc-top' },
        el('div', { class: 'dc-av' }, dcImg, el('span', { class: 'dc-st ' + status })),
        el('div', { class: 'dc-info' }, el('div', { class: 'dc-name' }, dc.name || name), el('div', { class: 'dc-tag' }, dc.tag)),
        copyBtn
      ),
      dc.activity ? el('div', { class: 'dc-act' }, el('span', { html: ICONS.pad }), el('span', {}, 'Playing ', el('b', {}, dc.activity))) : null
    );
    app.append(rise(el('div', { class: 'sec' }, 'Discord')), rise(card));
  }

  // Проекты
  if (Array.isArray(CONFIG.projects) && CONFIG.projects.length) {
    const grid = el('div', { class: 'projects' });
    CONFIG.projects.forEach((p) => {
      const img = el('img', { src: p.img || 'https://placehold.co/400x300/0A0A0A/FFFFFF?text=Project', alt: p.title || '', loading: 'lazy' });
      img.addEventListener('error', () => { img.src = 'https://placehold.co/400x300/0A0A0A/FFFFFF?text=Project'; }, { once: true });
      const cap = el('div', { class: 'proj-cap' }, el('b', {}, p.title || ''), p.desc ? el('span', {}, p.desc) : null);
      const card = p.url
        ? el('a', { class: 'proj', href: safeUrl(p.url), target: '_blank', rel: 'noopener' }, img, cap)
        : el('div', { class: 'proj' }, img, cap);
      grid.append(card);
    });
    app.append(rise(el('div', { class: 'sec' }, CONFIG.projectsTitle || 'Projects')), rise(grid));
  }

  // Footer
  if (CONFIG.footerText) app.append(rise(el('footer', { class: 'foot' }, CONFIG.footerText)));

  /* ----- Плавающие + и точки ----- */
  const pbox = document.getElementById('particles');
  const glyphs = ['+', '+', '+', '·', '•'];
  const count = window.innerWidth < 600 ? 18 : 30;
  for (let i = 0; i < count; i++) {
    const p = el('span', { class: 'p' }, glyphs[Math.floor(Math.random() * glyphs.length)]);
    p.style.left = (Math.random() * 100).toFixed(1) + '%';
    p.style.top = (Math.random() * 100).toFixed(1) + '%';
    p.style.fontSize = (10 + Math.random() * 8).toFixed(0) + 'px';
    p.style.setProperty('--d', (22 + Math.random() * 28).toFixed(1) + 's');
    p.style.setProperty('--dl', (-Math.random() * 30).toFixed(1) + 's');
    p.style.setProperty('--dx', ((Math.random() - 0.5) * 120).toFixed(0) + 'px');
    p.style.setProperty('--dy', ((Math.random() - 0.5) * 140).toFixed(0) + 'px');
    pbox.append(p);
  }

  /* ----- Свечение за курсором ----- */
  if (CONFIG.cursorGlow && canHover && !reduce) {
    const g = el('div', { class: 'cursor-glow' });
    document.body.append(g);
    let x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y;
    window.addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY; g.style.opacity = 1; }, { passive: true });
    document.addEventListener('mouseleave', () => { g.style.opacity = 0; });
    (function loop() {
      x += (tx - x) * 0.12; y += (ty - y) * 0.12;
      g.style.transform = 'translate(' + (x - 250).toFixed(1) + 'px,' + (y - 250).toFixed(1) + 'px)';
      requestAnimationFrame(loop);
    })();
  }
})();
</script>

</body>
</html>

2. КАК ПОМЕНЯТЬ НИК, АВАТАР, ОПИСАНИЕ, СОЦСЕТИ
   Всё находится в объекте CONFIG в начале тега script. HTML трогать не нужно.
   - displayName: ник, который отображается крупно (печатается по буквам). username: служебное имя.
   - bio: строка описания под бейджами.
   - avatar: ссылка на фото. Своё фото положите рядом с файлом и напишите avatar: "avatar.jpg". Цветное фото автоматически станет чёрно-белым.
   - badges: список бейджей. Доступны "online", "premium", "verified". Любой другой текст тоже отобразится капсулой. Пустой список [] скроет бейджи.
   - views и showViews: число просмотров и его включение/отключение. Важно: это просто красивое число из CONFIG, а не настоящий счётчик. Для реальной статистики подключите внешний сервис (например Plausible или Umami) отдельным тегом script.
   - cursorGlow: true или false, свечение за курсором (на телефонах отключается само).
   - discord: данные Discord-плашки (name, tag, status: online/idle/dnd/offline, activity: во что играете). enabled: false скрывает плашку.
   - footerText: текст в подвале.

3. КАК ДОБАВИТЬ ИЛИ УДАЛИТЬ ССЫЛКИ
   - Кнопки находятся в массиве socials. Каждая строка это одна кнопка. Удалить кнопку: удалите строку целиком. Добавить: скопируйте любую строку и измените значения. Порядок кнопок совпадает с порядком строк.
   - Поля: type (иконка), label (текст на кнопке), url (ссылка) или copy (текст, который копируется в буфер, как у Discord), primary: true (выделенная кнопка).
   - Доступные type: telegram, telegram-chat, vk, discord, youtube, tiktok, instagram, github, website. Для неизвестного type будет иконка глобуса.
   - Если массив socials пустой, на странице появится заглушка "Добавь ссылки в CONFIG".
   - Проекты: массив projects, поля title, desc, url, img. Показываются сеткой 2 в ряд. Пустой массив скрывает секцию. Название секции: projectsTitle.
   - Ссылки принимаются только с http://, https://, tg:// и mailto:, всё остальное заменяется на "#".

   GitHub Pages:

   Netlify:

5. ПРЕВЬЮ ССЫЛКИ В TELEGRAM (OG-ТЕГИ)
   Бот Telegram читает только статичный HTML и не выполняет JavaScript. Поэтому для красивой карточки при отправке ссылки отредактируйте теги meta в блоке head вручную: og:title, og:description и og:image. В og:image нужна полная публичная ссылка (https://...) на картинку, лучше квадратную или 1200x630. После изменений обновить кэш превью можно, написав боту @WebpageBot ссылку на вашу страницу.

6. КАК КУПИТЬ ДОМЕН И ПРИВЯЗАТЬ
   - Купите домен у регистратора (Namecheap, Porkbun, Cloudflare Registrar, Reg.ru и другие). Короткие зоны вроде .me, .lol, .bio, .xyz обычно стоят недорого, цену смотрите при покупке.

   - Через несколько минут (иногда до пары часов) включите галочку Enforce HTTPS.
   Привязка к Netlify:

   - HTTPS-сертификат Netlify выпустит автоматически.
   Актуальные адреса и шаги всегда сверяйте с документацией GitHub Pages и Netlify, они могут меняться.

7. ГДЕ МЕНЯТЬ ЦВЕТА И ШРИФТЫ
   - Блок :root в начале тега style. Там задаются цвета фона (bg, bg2), текст (text), серый второстепенный (muted), линии (line, line2), стекло (glass, glass-border), радиус скругления (radius), максимальная ширина (max) и шрифты (font-head, font-text). В коде у этих переменных по два дефиса в начале.
